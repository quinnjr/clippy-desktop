[package]
name = "clippy-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Microsoft Clippy, the Office Assistant, living on your desktop"
license = "MIT"
publish = false

[lib]
name = "clippy_app"
path = "src/lib.rs"

[[bin]]
name = "clippy-app"
path = "src/main.rs"

[dependencies]
# Windowing (X11, Wayland, Windows, macOS).
winit = "0.30"
# OpenGL context creation with an alpha-capable config on every platform.
glutin = "0.32"
glutin-winit = "0.5"
# glow 0.16 to match egui_glow 0.33 so the sprite renderer and egui share one
# GL context.
glow = "0.16"
raw-window-handle = "0.6"
# Sprite sheet decoding (PNG only, keeps the build small).
image = { version = "0.25", default-features = false, features = ["png"] }
# Animation definitions (the original Office Assistant frame tables) and the
# chat request/response bodies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Speech-balloon UI: egui drawn into the same GL context as the sprite.
egui = "0.33"
egui-winit = "0.33"
egui_glow = "0.33"

# Chat over any OpenAI-compatible server. Blocking client on a worker thread;
# rustls (the default) gives HTTPS for hosted APIs and plain HTTP for local
# servers.
ureq = "3"

# Persisted settings: a TOML file in the platform config directory.
toml = "0.8"
dirs = "6"

# Native right-click menu on Windows and macOS. Linux uses the keyboard
# (Escape / Q) because winit has no GTK window for a native popup there.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = { version = "0.19", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
